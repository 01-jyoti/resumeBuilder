<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="assets/gemini-svg.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Your Information · ResumeCraft</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f17;
      color: #f5f5f5;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #999;
    }

    .form-section {
      background: #181820;
      border: 1px solid #2b2b36;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .form-section h2 {
      font-size: 19px;
      margin-bottom: 20px;
      color: #a78bfa;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      color: #ccc;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #363642;
      background: #111118;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: #8b5cf6;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      padding: 12px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .cancel {
      background: #292933;
      color: white;
    }

    .save {
      background: #7c3aed;
      color: white;
    }

    .save:hover {
      background: #6d28d9;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <form id="resumeForm">


    <div class="container">

      <div class="header">
        <h1>Enter Your Information</h1>
        <p>Fill in your details to create your professional resume.</p>
      </div>

      <!-- Personal Information -->
      <div class="form-section">
        <h2>Personal Information</h2>

        <div class="form-grid">

          <div class="field">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. Pranay Waghmare">
          </div>

          <div class="field">
            <label>Job Title</label>
            <input type="text" id="jobTitle" placeholder="e.g. Software Developer">
          </div>

          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="e.g. pranay@gmail.com">
          </div>

          <div class="field">
            <label>Phone</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210">
          </div>

          <div class="field">
            <label>Location</label>
            <input type="text" id="location" placeholder="Mumbai, India">
          </div>

          <div class="field">
            <label>LinkedIn</label>
            <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
          </div>

          <div class="field">
            <label>GitHub</label>
            <input type="url" id="github" placeholder="https://github.com/...">
          </div>

          <div class="field">
            <label>Portfolio</label>
            <input type="url" id="portfolio" placeholder="https://yourportfolio.com">
          </div>

          <div class="field full">
            <label>Professional Summary</label>
            <textarea id="summary" placeholder="Write a short professional summary about yourself..."></textarea>
          </div>

        </div>
      </div>


      <!-- Education -->
      <div class="form-section">
        <h2>Education</h2>

        <div class="form-grid">

          <div class="field">
            <label>Degree</label>
            <input type="text" id="degree" placeholder="e.g. B.Tech Computer Engineering">
          </div>

          <div class="field">
            <label>Institution</label>
            <input type="text" id="institution" placeholder="College / University">
          </div>

          <div class="field">
            <label>Start Year</label>
            <input type="number" id="startYear" placeholder="2024">
          </div>

          <div class="field">
            <label>End Year</label>
            <input type="number" id="endYear" placeholder="2028">
          </div>

          <div class="field">
            <label>Grade / CGPA</label>
            <input type="text" id="grade" placeholder="8.5 CGPA">
          </div>

        </div>
      </div>


      <!-- Skills -->
      <div class="form-section">
        <h2>Skills</h2>

        <div class="field">
          <label>Technical Skills</label>
          <input type="text" id="skills" placeholder="Java, HTML, CSS, JavaScript, MySQL">
        </div>
      </div>


      <!-- Projects -->
      <div class="form-section">
        <h2>Projects</h2>

        <div class="form-grid">

          <div class="field">
            <label>Project Name</label>
            <input type="text" id="projectName" placeholder="e.g. CampusConnect">
          </div>

          <div class="field">
            <label>Technologies</label>
            <input type="text" id="technologies" placeholder="React, Java, MySQL">
          </div>

          <div class="field full">
            <label>Project Description</label>
            <textarea id="projectDescription" placeholder="Describe your project..."></textarea>
          </div>

          <div class="field">
            <label>GitHub URL</label>
            <input type="url" id="projectGithub">
          </div>

          <div class="field">
            <label>Live Project URL</label>
            <input type="url" id="projectLive">
          </div>

        </div>
      </div>


      <!-- Experience -->
      <div class="form-section">
        <h2>Experience</h2>

        <div class="form-grid">

          <div class="field">
            <label>Company Name</label>
            <input type="text" id="company">
          </div>

          <div class="field">
            <label>Job Title</label>
            <input type="text" id="experienceTitle">
          </div>

          <div class="field">
            <label>Start Date</label>
            <input type="date" id="experienceStart">
          </div>

          <div class="field">
            <label>End Date</label>
            <input type="date" id="experienceEnd">
          </div>

          <div class="field full">
            <label>Description</label>
            <textarea id="experienceDescription"></textarea>
          </div>

        </div>
      </div>


      <div class="buttons">
        <button class="cancel" type="button">Cancel</button>
        <button class="save" type="submit" id="saveBtn">Save & Continue</button>
      </div>
      <button type="button" id="fillDemoBtn"
        style="background-color: #6c757d; color: white; padding: 10px; margin-bottom: 15px; border: none; border-radius: 4px; cursor: pointer;">
        ⚡ Fill Demo Data (Testing)
      </button>
    </div>
  </form>
</body>
<script src="js/getInfo.js"></script>

</html>
